name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: developer-portfolio

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: developer-portfolio/package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVELOPER_PORTFOLIO_863DD }}
          channelId: live
          projectId: developer-portfolio-863dd
          entryPoint: developer-portfolio
