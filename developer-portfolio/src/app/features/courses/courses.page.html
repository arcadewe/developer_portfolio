<app-page-shell titleKey="nav.courses">
  <ul class="course-grid">
    @for (course of portfolio.courses(); track $index) {
      <li>
        <app-pixel-card class="course-card">
          <div class="course-badge" aria-hidden="true">
            <img src="/assets/images/sprites/sprite-1-3.png" alt="" />
          </div>
          <h2>{{ course.title }}</h2>
          <p class="provider">{{ course.provider }} · {{ course.year }}</p>
          <p class="summary">{{ course.summary }}</p>
          <app-tag-list [tags]="course.topics" tone="brick" />
        </app-pixel-card>
      </li>
    }
  </ul>
</app-page-shell>
