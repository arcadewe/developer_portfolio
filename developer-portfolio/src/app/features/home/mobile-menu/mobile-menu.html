<div class="mobile-nav">
  <button type="button" class="burger" [class.open]="menuOpen()" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-controls="mobile-menu" [attr.aria-label]="'menu.toggle' | translate">
    <span></span>
    <span></span>
    <span></span>
  </button>

  @if (menuOpen()) {
    <nav id="mobile-menu" class="mobile-menu" [attr.aria-label]="'menu.label' | translate">
      @for (cloud of clouds(); track cloud.labelKey) {
        @if (cloud.href.startsWith('/')) {
          <a [routerLink]="cloud.href" (click)="closeMenu()">{{ cloud.labelKey | translate }}</a>
        } @else {
          <a [attr.href]="cloud.href || '#'" target="_blank" rel="noopener noreferrer" (click)="closeMenu()">{{ cloud.labelKey | translate }}</a>
        }
      }
    </nav>
  }
</div>
