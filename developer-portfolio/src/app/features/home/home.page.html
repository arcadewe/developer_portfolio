<main class="world" aria-label="World 1-1 developer portfolio landing page">
  <app-navigation />

  <div class="clouds" aria-hidden="true">
    @for (cloud of clouds; track $index) {
      <img class="cloud" [style.left.%]="cloud.leftPercent" [style.top.px]="cloud.topPx" [attr.src]="cloudSpriteFile ? spritePath + cloudSpriteFile : null" alt="" />
    }
  </div>

  <div class="player" [style.left.%]="playerPosition()" [style.bottom.px]="groundOffsetPx + verticalOffsetPosition()" role="img" aria-label="Moving player character">
    <img [src]="playerSpritePath()" alt="" />
  </div>

  @for (block of levelBlocks; track $index) {
    <div class="level-block" [style.left.%]="block.leftPercent" [style.bottom.px]="block.bottomPx" aria-hidden="true">
      <img [attr.src]="block.spriteFile ? spritePath + block.spriteFile : null" alt="" />
    </div>
  }

  <div class="pipe" aria-hidden="true">
    <img [attr.src]="pipeSpriteFile ? spritePath + pipeSpriteFile : null" alt="" />
  </div>

  <div class="flag" aria-hidden="true">
    <img class="flag-bottom" [attr.src]="flagBottomSpriteFile ? spritePath + flagBottomSpriteFile : null" alt="" />
    <img class="flag-pole flag-pole-one" [attr.src]="flagPoleSpriteFile ? spritePath + flagPoleSpriteFile : null" alt="" />
    <img class="flag-pole flag-pole-two" [attr.src]="flagPoleSpriteFile ? spritePath + flagPoleSpriteFile : null" alt="" />
    <img class="flag-pole flag-pole-three" [attr.src]="flagPoleSpriteFile ? spritePath + flagPoleSpriteFile : null" alt="" />
    <img class="flag-pole flag-pole-four" [attr.src]="flagPoleSpriteFile ? spritePath + flagPoleSpriteFile : null" alt="" />
    <img class="flag-top" [attr.src]="flagTopSpriteFile ? spritePath + flagTopSpriteFile : null" alt="" />
    <img class="flag-flag" [attr.src]="flagFlagSpriteFile ? spritePath + flagFlagSpriteFile : null" alt="" />
  </div>

  <div class="floor" aria-hidden="true">
    @for (tile of floorTiles; track tile) {
      <img [src]="floorSpritePath" alt="" />
    }
  </div>

  <audio class="sfx" #backgroundMusic [attr.src]="backgroundMusicFile || null" loop></audio>
  <audio class="sfx" #jumpSound [attr.src]="jumpSoundFile || null"></audio>
  <audio class="sfx" #blockHitSound [attr.src]="blockHitSoundFile || null"></audio>
</main>
