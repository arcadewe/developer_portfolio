<app-page-shell titleKey="nav.aboutMe">
  <app-pixel-card class="about-card">
    <p>{{ 'aboutMe.intro' | translate }}</p>
    <p>{{ 'aboutMe.body' | translate }}</p>
  </app-pixel-card>

  <h2 class="skills-title pixel-heading">{{ 'aboutMe.skillsTitle' | translate }}</h2>

  <div class="skill-groups">
    @for (group of portfolio.skillGroups; track group.titleKey) {
      <app-pixel-card tone="brick">
        <h3 class="skill-group-title">{{ group.titleKey | translate }}</h3>
        <app-tag-list [tags]="group.skills" />
      </app-pixel-card>
    }
  </div>
</app-page-shell>
