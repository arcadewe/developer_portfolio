<app-page-shell titleKey="nav.experience">
  <ol class="timeline">
    @for (item of portfolio.experiences(); track $index) {
      <li class="timeline-item">
        <app-pixel-card>
          <span class="level-tag">{{ 'experience.level' | translate }} 1-{{ $index + 1 }}</span>
          <div class="level-heading">
            <h2>{{ item.role }}</h2>
            <span class="period">{{ item.period }}</span>
          </div>
          <p class="company">{{ item.company }}</p>
          <ul class="highlights">
            @for (highlight of item.highlights; track highlight) {
              <li>{{ highlight }}</li>
            }
          </ul>
          <app-tag-list [tags]="item.stack" tone="sky" />
        </app-pixel-card>
      </li>
    }
  </ol>
</app-page-shell>
