<article class="project-card">
  <div class="project-icon" aria-hidden="true"><img [src]="'/assets/images/sprites/' + project().sprite" alt="" /></div>
  <div class="project-copy">
    <p class="project-label">LEVEL 01</p>
    <h3>{{ project().title }}</h3>
    <p>{{ project().summary }}</p>
    <div class="project-meta">@for (item of project().stack; track item) { <span>{{ item }}</span> }</div>
  </div>
  @if (link()) { <a class="project-link" [href]="link()" target="_blank" rel="noreferrer">Open project</a> }
</article>
